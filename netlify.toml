[build]
  command = "pnpm --filter @sheep-comb/web generate"
  publish = "packages/web/.output/public"

[build.environment]
  NODE_VERSION = "22"

# SPA ルーティングのためのリダイレクト設定 (/* -> /index.html)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# WASM ファイルの配信ヘッダー
[[headers]]
  for = "*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"
