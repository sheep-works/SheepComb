<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#11111b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 背景角丸 -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8" />

  <!-- 外枠グローサークル -->
  <circle cx="256" cy="256" r="190" fill="url(#primaryGrad)" opacity="0.15" filter="url(#glow)" />

  <!-- 羊のモコモコ毛（Cloud / Wool Base） -->
  <g fill="#ffffff" filter="url(#glow)">
    <circle cx="256" cy="190" r="58" />
    <circle cx="190" cy="210" r="54" />
    <circle cx="322" cy="210" r="54" />
    <circle cx="150" cy="265" r="52" />
    <circle cx="362" cy="265" r="52" />
    <circle cx="180" cy="325" r="54" />
    <circle cx="332" cy="325" r="54" />
    <circle cx="256" cy="345" r="58" />
    <!-- 中心埋め -->
    <rect x="180" y="210" width="152" height="120" rx="20" />
  </g>

  <!-- 羊の耳 -->
  <ellipse cx="145" cy="250" rx="36" ry="18" fill="#fda4af" transform="rotate(-25 145 250)" />
  <ellipse cx="367" cy="250" rx="36" ry="18" fill="#fda4af" transform="rotate(25 367 250)" />

  <!-- 羊の顔（Dark Center Face） -->
  <rect x="196" y="225" width="120" height="110" rx="42" fill="#1e1e2e" />

  <!-- 羊の頭の毛（前髪モコモコ） -->
  <circle cx="232" cy="225" r="22" fill="#ffffff" />
  <circle cx="256" cy="215" r="24" fill="#ffffff" />
  <circle cx="280" cy="225" r="22" fill="#ffffff" />

  <!-- つぶらな瞳 -->
  <circle cx="228" cy="268" r="9" fill="#ffffff" />
  <circle cx="284" cy="268" r="9" fill="#ffffff" />
  <!-- 瞳のハイライト -->
  <circle cx="230" cy="266" r="3.5" fill="#1e1e2e" />
  <circle cx="286" cy="266" r="3.5" fill="#1e1e2e" />
  <circle cx="226" cy="264" r="2" fill="#ffffff" />
  <circle cx="282" cy="264" r="2" fill="#ffffff" />

  <!-- ほっぺ（チーク） -->
  <circle cx="212" cy="288" r="8" fill="#fda4af" opacity="0.75" />
  <circle cx="300" cy="288" r="8" fill="#fda4af" opacity="0.75" />

  <!-- お口（Y字マズル） -->
  <path d="M256 288 v12 m-8 8 l8 -8 l8 8" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- 下部テキスト装飾（SHEEPCOMB） -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#818cf8" letter-spacing="4" text-anchor="middle">SHEEPCOMB</text>
</svg>
